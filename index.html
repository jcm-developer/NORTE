<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NORTE</title>
    <link rel="icon" href="assets/img/icon.ico" type="image/png" sizes="16x16" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="logo"><img src="assets/img/logo.png" alt="logo"></a>
        <nav>
            <a href="cart.html" class="cart-wrapper">
                <i id="cart-icon" class="ri-shopping-cart-2-line cart-icon"></i>
                <span id="cart-count" class="cart-count">0</span>
            </a>
        </nav>
    </header>

    <section class="front-page">
        <div class="front-page-text">
            <p style="font-weight: bold;">New in</p>
            <h1>BLACK ASPENALF JACKET</h1>
            <p style="font-weight: 500;">Explore our new products!</p>
            <br>
            <a href="product.html?id=1" class="button-primary">Explore now</a>
        </div>
        <div class="front-page-image">
            <img src="assets/img/products/jacket-1.png" alt="Yeezy Boost">
            <svg id="sw-js-blob-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="sw-gradient" x1="0" x2="1" y1="1" y2="0">
                        <stop id="stop1" stop-color="rgba(59, 130, 246, 1)" offset="0%"></stop>
                        <stop id="stop2" stop-color="rgba(70.697, 214.726, 255, 1)" offset="100%"></stop>
                    </linearGradient>
                </defs>
                <path fill="url(#sw-gradient)"
                    d="M25.7,-31C32.9,-24.5,38.2,-16.1,39,-7.5C39.7,1,35.8,9.7,31.1,18.1C26.4,26.4,20.9,34.4,12.8,38.9C4.8,43.4,-5.9,44.4,-15,41.1C-24,37.8,-31.4,30.1,-36.4,21.2C-41.5,12.2,-44,2,-40.8,-5.6C-37.6,-13.3,-28.7,-18.4,-20.9,-24.8C-13.1,-31.2,-6.6,-39,1.3,-40.6C9.2,-42.2,18.4,-37.6,25.7,-31Z"
                    width="100%" height="100%" transform="translate(50 50)" stroke-width="0" style="transition: 0.3s;">
                </path>
            </svg>
        </div>
    </section>

    <section class="all-products" id="all-products">
        <h1>All products</h1>
        <div id="product-list" class="product-grid"></div>
    </section>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-brand">
                <img src="assets/img/logo.png" alt="logo">
            </div>
            <div class="footer-links">
                <h4>Explore</h4>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="cart.html">Cart</a></li>
                </ul>
            </div>
            <div class="footer-support">
                <h4>Support</h4>
                <ul>
                    <li><a href="#">Contact Us</a></li>
                    <li><a href="#">FAQ</a></li>
                    <li><a href="#">Returns</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2025 NORTE Shop. All rights reserved.</p>
        </div>
    </footer>

    <script src="assets/js/cards.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            function updateCartCount() {
                const cart = JSON.parse(localStorage.getItem("cart")) || [];
                const totalQty = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
                const countElement = document.getElementById("cart-count");
                if (countElement) countElement.textContent = totalQty;
            }

            updateCartCount();
        });
    </script>
</body>

</html>
